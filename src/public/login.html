<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Salão de Beleza</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <header>
        <h1>💇 Salão de Beleza</h1>
    </header>

    <main>
        <h2>Entrar no Sistema</h2>

        <form action="/login" method="POST" class="formulario">

            <label>Email</label>
            <input type="email" name="email" placeholder="Ex: maria@email.com" required />

            <label>Senha</label>
            <input type="password" name="senha" placeholder="Sua senha" required />

            <div class="botoes">
                <button type="submit" class="btn-salvar">Entrar</button>
                <a href="/cadastro" class="btn-cancelar">Cadastro</a>
            </div>

        </form>
    </main>

</body>
</html>
